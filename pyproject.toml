[project]
name = "home-energy"
version = "0.1.0"
description = "FPL home energy MCP server"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "mcp[cli]>=2.1.1",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_energy"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
